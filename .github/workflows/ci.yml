name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.11"
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The suite is hermetic (see tests/conftest.py): no .env, no API keys,
      # no network. If a test needs configuration it must provide its own.
      - run: pytest -q

  schemas:
    name: Protocol schemas are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Regenerate and fail if the committed schemas drifted from the
      # Pydantic models. The published spec and the implementation must not
      # be allowed to diverge silently.
      - run: python -m agentic_bus.core.protocol.export_schemas --check

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The compose stack is the documented way in, so a Dockerfile that
      # stops building has to fail here rather than on a user's first run.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build coordinator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-bus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          load: true
          tags: agentic-bus-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # Exercises the real entrypoint (schema bootstrap, then the command),
      # without needing an LLM or the rest of the stack.
      - name: Smoke-test the coordinator image
        run: docker run --rm agentic-bus:ci agbus --version

      # langchain-mcp-adapters is imported lazily, so a broken extra would
      # otherwise only surface when someone bridges an MCP server. The
      # managed-agent path needs nothing beyond [server] since it moved off
      # CrewAI, so the agent builder is checked directly instead.
      - name: Verify optional extras are importable
        run: |
          docker run --rm --entrypoint python agentic-bus:ci             -c "import langchain_mcp_adapters; from langchain.agents import create_agent; print('extras importable')"
