[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-bus"
version = "0.3.0"
description = "Reference implementation of the Liquid Interfaces Protocol (LIP)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "agents",
    "multi-agent",
    "liquid-interfaces",
    "lip",
    "ibac",
    "mcp",
    "agent-coordination",
    "interoperability",
]
authors = [
    { name = "Dhiogo José Correa de Sá", email = "dhiogo.correa@draiven.io" },
    { name = "Carlos Pereira Lopes Filho", email = "carlos.lopes@draiven.io" },
    { name = "Carlos Eduardo Schmiedel", email = "carlos.schmiedel@draiven.io" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]

# Base install: everything needed to *write an agent* and talk to a bus.
# Deliberately small — an agent author should not have to install a web
# framework, an ORM and an LLM stack to implement two methods.
dependencies = [
    "pydantic>=2.11,<3.0",
    "websockets>=15.0,<16.0",
    "opentelemetry-api>=1.33,<2.0",
    "opentelemetry-sdk>=1.33,<2.0",
    "python-dotenv>=1.1,<2.0",
]

[project.urls]
Homepage = "https://liquidinterfaces.org"
Documentation = "https://github.com/draiven-io/agentic-bus#readme"
Repository = "https://github.com/draiven-io/agentic-bus"
Specification = "https://github.com/draiven-io/liquid-interfaces"
Paper = "https://arxiv.org/abs/2601.21993"
Issues = "https://github.com/draiven-io/agentic-bus/issues"

[project.scripts]
agbus = "agentic_bus.cli:main"

[project.optional-dependencies]
# Running a coordinator, and with it the managed agents it hosts: those are
# LangGraph ReAct agents now, so they need nothing beyond this. There is no
# longer a separate [agents] extra — CrewAI was the only reason for one.
server = [
    "langchain>=1.0.0,<2.0",
    "langgraph>=1.0.0,<2.0",
    "langchain-openai>=1.0.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-google-genai>=2.1,<3.0",
    "langchain-ollama>=1.0,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "sqlalchemy>=2.0,<3.0",
    "cryptography>=44.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

# MCP bridge: exposes any MCP server's tools as bus capabilities.
mcp = [
    "langchain-mcp-adapters>=0.3,<1.0",
]

# Everything: run a coordinator, managed agents and the MCP bridge.
all = [
    "agentic-bus[server,mcp]",
]

dev = [
    "agentic-bus[all]",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["agentic_bus"]

[tool.hatch.build.targets.sdist]
# Enumerated explicitly. Hatchling's default sdist sweeps the whole project
# directory and only honours the *root* .gitignore, so `ui/node_modules`
# (ignored by ui/.gitignore, not the root one) landed in the archive: 25,741
# files and 86 MB, over PyPI's per-file limit.
#
# The dashboard is deliberately absent — it ships as a container image, not
# inside the Python package.
only-include = [
    "agentic_bus",
    "AGENTS.md",
    "schemas",
    "tests",
    "docker",
    "Dockerfile",
    "docker-compose.yml",
    "lip.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than left at ruff's default: that default has
# changed between minor versions (0.8 -> 0.16 added TRY/SIM/S/PIE/RUF/UP/B/C4/
# ISC/YTT, turning a clean `ruff check .` into 280 findings on an unpinned
# ruff>=0.11 install with no code change). This is the pyflakes + pycodestyle
# error subset the project has actually been checked against.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules must call ``load_dotenv()`` before importing anything that
# reads configuration at import time, so their imports legitimately sit
# below the first statement.
"agentic_bus/coordinator/server.py" = ["E402"]
"agentic_bus/agents/examples/*" = ["E402"]
