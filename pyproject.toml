[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-bus"
version = "0.1.0"
description = "Reference implementation of the Liquid Interfaces Protocol (LIP)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "agents",
    "multi-agent",
    "liquid-interfaces",
    "lip",
    "ibac",
    "mcp",
    "agent-coordination",
    "interoperability",
]
authors = [
    { name = "Dhiogo José Correa de Sá", email = "dhiogo.correa@draiven.io" },
    { name = "Carlos Pereira Lopes Filho", email = "carlos.lopes@draiven.io" },
    { name = "Carlos Eduardo Schmiedel", email = "carlos.schmiedel@draiven.io" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "langchain>=1.0.0,<2.0",
    "langgraph>=1.0.0,<2.0",
    "langchain-openai>=1.0.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-google-genai>=2.1,<3.0",
    "langchain-ollama>=1.0,<2.0",
    "websockets>=15.0,<16.0",
    "pydantic>=2.11,<3.0",
    "opentelemetry-api>=1.33,<2.0",
    "opentelemetry-sdk>=1.33,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "python-dotenv>=1.1,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "cryptography>=44.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.urls]
Homepage = "https://liquidinterfaces.org"
Documentation = "https://github.com/draiven-io/agentic-bus#readme"
Repository = "https://github.com/draiven-io/agentic-bus"
Specification = "https://github.com/draiven-io/liquid-interfaces"
Paper = "https://arxiv.org/abs/2601.21993"
Issues = "https://github.com/draiven-io/agentic-bus/issues"

[project.scripts]
agbus = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These modules must call ``load_dotenv()`` before importing anything that
# reads configuration at import time, so their imports legitimately sit
# below the first statement.
"app/coordinator/server.py" = ["E402"]
"app/agents/examples/*" = ["E402"]
